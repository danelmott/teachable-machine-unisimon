<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clasificador Teachable Machine</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="clasificador">
        <nav class="tabs" role="tablist">
            <button role="tab" data-tab="imagen" aria-selected="true">Imagen</button>
            <button role="tab" data-tab="audio" aria-selected="false">Audio</button>
            <button role="tab" data-tab="pose" aria-selected="false">Pose</button>
        </nav>

        <!--Section for uploading images to the classification model-->
        <section data-panel="imagen">
            <label class="zona">
                <input type="file" accept="image/*">
                <img alt="Imagen seleccionada">
                <span><span class="raton">Arrastra una imagen aquí o haz clic para elegirla</span><span class="tactil">Toca para tomar o elegir una imagen</span></span>
            </label>
            <p class="estado">Cargando modelo…</p>
            <ul class="resultados"></ul>
        </section>

        <!--Section for listening to the microphone with the audio model-->
        <section data-panel="audio" hidden>
            <div class="zona zona-audio">
                <button type="button" class="escuchar" disabled>Escuchar</button>
                <span>Usa el micrófono para clasificar sonidos en vivo</span>
            </div>
            <p class="estado"></p>
            <ul class="resultados"></ul>
        </section>

        <!--Section for uploading images to the pose model-->
        <section data-panel="pose" hidden>
            <label class="zona">
                <input type="file" accept="image/*">
                <img alt="Imagen seleccionada">
                <span><span class="raton">Arrastra una foto de una persona aquí o haz clic para elegirla</span><span class="tactil">Toca para tomar o elegir una foto de una persona</span></span>
            </label>
            <p class="estado"></p>
            <ul class="resultados"></ul>
        </section>
    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.6/dist/teachablemachine-pose.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
<script src="index.js" type="module"></script>
</html>
